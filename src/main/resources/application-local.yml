app:
  schedule:
    enabled: false
    optimization: false
    period: 60000
    priceIncreasePercentage: 10.1
spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  application:
    name: zero
  datasource:
    url: ${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show_sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Samara
    hibernate:
      show_sql: true
      ddl-auto: validate
rest:
  web-clients:
    chunk-size: 1
    account-number:
      base-url: http://localhost:8081
      get-account-numbers-path: /getAccountsInfo/getAccountNumbers
      retry-attempts: 2
      min-backoff: 1
      max-backoff: 5
    inn:
      base-url: http://localhost:8082
      get-account-inns-path: /getAccountsInfo/getAccountInns
      retry-attempts: 2
      min-backoff: 1
      max-backoff: 5
  integration-executor:
    core-pool-size: 10
    max-pool-size: 10
    queue-capacity: 100
server:
  port: 8080
