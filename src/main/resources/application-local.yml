app:
  schedule:
    enabled: false
    optimization: false
    period: 60000
    priceIncreasePercentage: 10.1
  kafka:
    enabled: true
    debug-producer-enabled: true
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  application:
    name: zero
  datasource:
    url: ${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show_sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Samara
    hibernate:
      show_sql: true
      ddl-auto: validate
  kafka:
    admin:
      fail-fast: true
    bootstrap-servers: localhost:9094
    consumer:
      group-id: zero-order-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 1
rest:
  web-clients:
    account-number:
      base-url: http://localhost:8081
      get-account-numbers-path: /getAccountsInfo/getAccountNumbers
      retry-attempts: 2
      min-backoff: 1
      max-backoff: 5
    inn:
      base-url: http://localhost:8082
      get-account-inns-path: /getAccountsInfo/getAccountInns
      retry-attempts: 2
      min-backoff: 1
      max-backoff: 5
  integration-executor:
    core-pool-size: 10
    max-pool-size: 10
    queue-capacity: 100
server:
  port: 8080

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:product-images}
